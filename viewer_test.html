<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onset Detection 결과 확인</title>
<style>
  * { box-sizing: border-box; word-break: keep-all; overflow-wrap: break-word; }
  body {
    margin: 0;
    font-family: '맑은 고딕', 'Malgun Gothic', Arial, sans-serif;
    background: #eef1f5;
    padding: 40px;
  }
  .card {
    max-width: 900px;
    margin: 0 auto;
    background: white;
    border-radius: 8px;
    padding: 32px 40px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  h1 { font-size: 24px; color: #1c1c1c; margin-top: 0; }
  p.desc { color: #555; font-size: 15px; line-height: 1.6; }

  /* 파일 선택 영역 */
  .upload-box {
    border: 2px dashed #2f5da8;
    border-radius: 6px;
    padding: 24px;
    text-align: center;
    margin: 20px 0;
    color: #2f5da8;
  }
  .upload-box input { margin-top: 10px; }

  /* 파형을 그릴 캔버스 */
  canvas {
    width: 100%;
    height: 220px;
    background: #f7f9fc;
    border: 1px solid #d3d9e2;
    border-radius: 4px;
    display: block;
    margin-top: 20px;
  }

  .stats {
    display: flex;
    gap: 20px;
    margin-top: 20px;
  }
  .stat-box {
    flex: 1;
    background: #f4f7fb;
    border-left: 4px solid #2f5da8;
    padding: 14px 16px;
  }
  .stat-box .num { font-size: 26px; font-weight: bold; color: #2f5da8; }
  .stat-box .label { font-size: 13px; color: #666; margin-top: 4px; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    font-size: 14px;
  }
  table th, table td {
    border: 1px solid #d3d9e2;
    padding: 8px 12px;
    text-align: left;
  }
  table th { background: #2f5da8; color: white; }
  table tbody { display: block; max-height: 220px; overflow-y: auto; }
  table thead, table tbody tr { display: table; width: 100%; table-layout: fixed; }
</style>
</head>
<body>

<div class="card">
  <h1>Onset Detection 결과 확인</h1>
  <p class="desc">
    Python(librosa)으로 분석해서 만든 <b>onset_result.json</b> 파일을 아래에서 불러오면,
    파형과 감지된 onset(소리 시작 지점)을 화면에서 바로 확인할 수 있습니다.
  </p>

  <div class="upload-box">
    onset_result.json 파일을 선택하세요
    <br>
    <input type="file" id="fileInput" accept=".json">
  </div>

  <canvas id="waveCanvas"></canvas>

  <div class="stats">
    <div class="stat-box">
      <div class="num" id="durationStat">-</div>
      <div class="label">음원 길이 (초)</div>
    </div>
    <div class="stat-box">
      <div class="num" id="onsetCountStat">-</div>
      <div class="label">감지된 onset 개수</div>
    </div>
  </div>

  <table>
    <thead><tr><th>번호</th><th>시간 (분:초)</th></tr></thead>
    <tbody id="onsetTableBody"></tbody>
  </table>
</div>

<script>
  // 파일 입력창에서 파일을 선택하면 실행되는 함수
  document.getElementById('fileInput').addEventListener('change', function (e) {
    const file = e.target.files[0];           // 선택한 첫 번째 파일 가져오기
    if (!file) return;                        // 아무 파일도 선택 안 했으면 종료

    const reader = new FileReader();          // 파일 내용을 읽어주는 브라우저 기본 기능
    reader.onload = function (event) {
      const data = JSON.parse(event.target.result);  // 읽은 텍스트를 JSON 객체로 변환
      renderResult(data);                     // 화면에 결과 그리기
    };
    reader.readAsText(file);                  // 파일을 텍스트로 읽기 시작
  });

  // JSON 데이터를 받아서 화면에 통계, 표, 그래프를 그려주는 함수
  function renderResult(data) {
    // ---- 상단 통계 숫자 채우기 ----
    document.getElementById('durationStat').textContent = data.duration.toFixed(1);
    document.getElementById('onsetCountStat').textContent = data.onset_times.length;

    // ---- onset 시간 목록 표 채우기 ----
    const tbody = document.getElementById('onsetTableBody');
    tbody.innerHTML = '';                     // 기존 내용 비우기
    data.onset_times.forEach(function (t, i) {
      const min = Math.floor(t / 60);
      const sec = (t % 60).toFixed(2);
      const row = document.createElement('tr');
      row.innerHTML = `<td>${i + 1}</td><td>${min}분 ${sec}초</td>`;
      tbody.appendChild(row);
    });

    // ---- 파형 + onset 지점 그리기 ----
    drawWaveform(data.waveform, data.onset_times, data.duration);
  }

  // 캔버스에 파형(회색 선)과 onset 지점(빨간 세로선)을 그리는 함수
  function drawWaveform(waveform, onsetTimes, duration) {
    const canvas = document.getElementById('waveCanvas');
    canvas.width = canvas.clientWidth;        // 화면에 보이는 실제 너비에 맞춰 해상도 설정
    canvas.height = 220;
    const ctx = canvas.getContext('2d');      // 그림 그리는 도구(context) 가져오기
    const w = canvas.width;
    const h = canvas.height;
    const mid = h / 2;                        // 파형의 세로 중앙선(0 지점)

    ctx.clearRect(0, 0, w, h);                // 이전에 그린 내용 지우기

    // 파형 그리기 (waveform 배열의 각 값을 좌우로 나열)
    ctx.beginPath();
    ctx.strokeStyle = '#8fa3c2';
    ctx.lineWidth = 1;
    waveform.forEach(function (v, i) {
      const x = (i / waveform.length) * w;    // 배열 인덱스를 화면 x좌표로 변환
      const y = mid - v * mid * 0.9;          // 진폭 값을 화면 y좌표로 변환 (가운데 기준 위아래)
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // onset 지점마다 빨간 세로선 그리기
    ctx.strokeStyle = '#e04040';
    ctx.lineWidth = 1.5;
    onsetTimes.forEach(function (t) {
      const x = (t / duration) * w;           // 시간(초)을 화면 x좌표로 변환
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
    });
  }
</script>

</body>
</html>
